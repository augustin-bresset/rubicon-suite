services:
  db:
    image: postgres:13
    env_file: .env
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
    volumes:
      - db-data:/var/lib/postgresql/data
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  odoo:
    image: odoo:18.0
    env_file: .env
    depends_on:
      - db
    # Dev only: --dev=assets recompiles web assets on the fly so edited JS/XML
    # is served without a module upgrade. Must be a CLI flag: the config-file
    # dev_mode key is overwritten by the command-line value in this Odoo build.
    command: odoo --dev=assets
    ports:
      - "8069:8069"
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      # (optionnel) laisse plutôt le host/user/pass dans odoo.conf pour éviter la double source d'info
    volumes:
      - odoo_data:/var/lib/odoo/.local/share/Odoo   # << filestore + sessions
      - ./rubicon_addons:/mnt/extra-addons
      - ./data/pictures:/mnt/extra-addons/pictures:ro
      - ./external_addons:/mnt/external-addons
      - ./odoo_conf/odoo.conf:/etc/odoo/odoo.conf:ro
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"

volumes:
  db-data:
  odoo_data:
