# nginx template for the PRODUCTION server (public VPS with a domain name).
#
# Install:
#   1. Replace YOUR_DOMAIN below (e.g. erp.rubicon.co.th).
#   2. sudo apt install nginx certbot python3-certbot-nginx
#   3. sudo cp ops/server/nginx_prod.conf /etc/nginx/sites-available/rubicon
#      sudo ln -s /etc/nginx/sites-available/rubicon /etc/nginx/sites-enabled/
#      sudo rm -f /etc/nginx/sites-enabled/default
#   4. sudo certbot --nginx -d YOUR_DOMAIN     # issues the certificate, keeps the paths below
#   5. sudo nginx -t && sudo systemctl reload nginx
#
# Requires proxy_mode = True in odoo.prod.conf (set in the template) and the
# loopback-bound ports 8069/8072 from docker-compose.prod.yml.
# Alternative without a domain: a named Cloudflare tunnel with two ingress
# rules, /websocket -> http://127.0.0.1:8072 and everything else ->
# http://127.0.0.1:8069.

upstream odoo_http {
    server 127.0.0.1:8069;
}
upstream odoo_websocket {
    server 127.0.0.1:8072;
}

# Login brute-force throttling: 10 requests/minute per client IP on /web/login,
# with a burst so a mistyped password never locks a legitimate user out.
limit_req_zone $binary_remote_addr zone=rubicon_login:10m rate=10r/m;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name YOUR_DOMAIN;

    ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    access_log /var/log/nginx/rubicon.access.log;
    error_log  /var/log/nginx/rubicon.error.log;

    # Odoo requests can be slow (reports, imports): stay above limit_time_real.
    proxy_connect_timeout 60s;
    proxy_send_timeout    300s;
    proxy_read_timeout    300s;
    proxy_buffers 16 64k;
    proxy_buffer_size 128k;
    client_max_body_size 64M;

    proxy_set_header Host              $host;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_redirect off;

    # Database manager/selector: already disabled by list_db = False in
    # odoo.prod.conf; blocked here too so it never depends on a single setting.
    location ~ ^/web/database/ {
        return 404;
    }

    location = /web/login {
        limit_req zone=rubicon_login burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://odoo_http;
    }

    location = /web/health {
        access_log off;
        proxy_pass http://odoo_http;
    }

    # Odoo >= 17 bus: websocket served by the gevent process on 8072.
    location /websocket {
        proxy_pass http://odoo_websocket;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://odoo_http;
    }

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css text/plain text/javascript application/javascript application/json application/xml image/svg+xml;
}
